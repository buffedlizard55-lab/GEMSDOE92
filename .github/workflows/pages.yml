name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install validation dependencies
        run: pip install -r requirements.txt
      - name: fail closed before publishing downloads
        run: python scripts/check_site.py
      - name: stage only public files and preserve existing docs URLs
        run: |
          mkdir -p .cache/pages
          cp index.html .nojekyll .cache/pages/
          cp -R docs .cache/pages/docs
      # Refresh only the staged artifact. On network/parser failure the JSON
      # explicitly says unavailable; it can never grant submission clearance.
      - name: refresh official public leaderboard snapshot
        run: python scripts/update_leaderboard_feed.py --output .cache/pages/docs/downloads/live_leaderboard.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .cache/pages
      - id: deploy
        uses: actions/deploy-pages@v4
