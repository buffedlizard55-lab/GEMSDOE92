name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: tests
        run: python -m pytest tests -q
      - name: no conflict markers
        run: |
          if grep -rInE '^(<<<<<<<|=======|>>>>>>>)' --include='*.py' --include='*.md' --include='*.json' . ; then
            echo "conflict markers found"; exit 1
          fi
      - name: parent recipe must never be a template in CI
        run: |
          if [ -f registry/parents/R0.json ]; then
            python -m gems parent --recipe registry/parents/R0.json --data-root data || true
          else
            echo "no R0.json yet (expected until the human supplies inputs)"
          fi
