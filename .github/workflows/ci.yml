name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: tests
        run: python -m pytest tests -q
      - name: no conflict markers
        run: |
          if grep -rInE '^(<<<<<<<|=======|>>>>>>>)' --include='*.py' --include='*.md' --include='*.json' . ; then
            echo "conflict markers found"; exit 1
          fi
      - name: pinned inputs must hash exactly (make manifest)
        run: make manifest PYTHON=python
      - name: parent must be provable from the committed bytes (make verify)
        run: make verify PYTHON=python
      - name: public download status and exact TIFF format gates
        run: python scripts/check_site.py
